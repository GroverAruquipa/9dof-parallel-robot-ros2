# Dynamic parameters for the MuJoCo simulation.
# ESTIMATES: masses come from the STL volumes with PLA (1240 kg/m^3) and the
# actuator data are placeholders. Replace them with SolidWorks "Mass
# Properties" and the actuator datasheet, then run scripts/generate_mjcf.py.
ninedof_dynamics:
  mass:              # kg
    slider: 0.00174
    distal_link: 0.00224
    platform_1: 0.01275
    platform_2: 0.01240
  actuator:
    max_force: 20.0      # N
    kp: 50000.0          # N/m, position servo stiffness (lead-screw actuator, estimate)
    damping_ratio: 1.0
    armature: 0.01       # kg, reflected inertia of the drive
  passive_joint_damping: 0.0005  # N m s/rad, ball joints
  finger_friction: 0.4
